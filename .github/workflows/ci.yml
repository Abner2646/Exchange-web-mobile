name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Cancel superseded runs on the same ref (a new push obsoletes the old run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Unit suite first: no database needed, fastest feedback. Runs with
      # coverage so the coverageThreshold floor in jest.config.js is enforced —
      # the build fails if coverage drops below it.
      - name: Unit tests + coverage floor
        run: npm run test:coverage

      # Integration suite against the ephemeral dockerized Postgres. The runner
      # has Docker + compose; we reuse the exact local compose file. Hard rule:
      # no mainnet keys ever reach CI — the tests run entirely on test defaults
      # (see tests/helpers/testEnv.js) and injected fakes.
      - name: Start ephemeral test database
        run: npm run test:integration:up

      - name: Integration tests + coverage floor
        run: npm run test:integration:coverage

      - name: Stop test database
        if: always()
        run: npm run test:integration:down

  # Dependency vulnerability scan (Fase 4.6). Hard gate at high/critical: the tree
  # is clean there today, so this passes now and BLOCKS a merge that introduces (or
  # a newly-disclosed transitive) high/critical advisory — forcing it to be dealt
  # with. Dependabot opens the fix PRs. Moderate/low are not gated (noise); review
  # them via `npm audit`. If an unfixable transitive high ever blocks unrelated
  # work, downgrade to `continue-on-error: true` (advisory) rather than muting it.
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high
