# nginx para BitFlow con cert SELF-SIGNED (stopgap sin dominio). Cuando haya dominio:
# certbot --nginx -d TU_DOMINIO lo reemplaza por un cert válido de Let's Encrypt.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/bitflow/selfsigned.crt;
    ssl_certificate_key /etc/ssl/bitflow/selfsigned.key;

    root /var/www/bitflow;
    index index.html;
    client_max_body_size 2m;

    # API → backend Node (solo localhost).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /health { proxy_pass http://127.0.0.1:3001/health; }

    # SPA: rutas no-API → index.html.
    location / { try_files $uri $uri/ /index.html; }
}
