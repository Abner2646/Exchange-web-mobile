# nginx config for the GO-LIVE cutover to the Next.js app (Slice 8).
# Replaces the static-CRA config (bitflow-live.conf): instead of serving
# /var/www/bitflow as an SPA, everything that is not /api or /health is proxied
# to the self-hosted Next.js process (pm2 "bitflow-web", port 3000, same-origin).
#
# Cutover (reversible — see deploy/CUTOVER.md):
#   sudo cp deploy/nginx/bitflow-next.conf /etc/nginx/sites-available/bitflow
#   sudo nginx -t && sudo systemctl reload nginx
# Rollback: restore the previous sites-available/bitflow (the CRA config) + reload.

server {
    if ($host = bitflow.community) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bitflow.community;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name bitflow.community;
    ssl_certificate /etc/letsencrypt/live/bitflow.community/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bitflow.community/privkey.pem; # managed by Certbot

    client_max_body_size 2m;

    # API → backend Node (localhost only; never exposed directly).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /health { proxy_pass http://127.0.0.1:3001/health; }

    # Next build assets are content-hashed and immutable → cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else → Next.js (SSR/SSG) on :3000, same-origin.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
