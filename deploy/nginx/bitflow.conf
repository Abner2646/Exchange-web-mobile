# nginx reverse proxy para BitFlow (Next.js self-hosted, Slice 8 go-live).
# - 80 → redirige a 443
# - 443 → termina TLS, hace proxy de /api + /health al backend (localhost:3001)
#         y de TODO lo demás al proceso Next.js (localhost:3000, same-origin).
# Reemplazá TU_DOMINIO por el dominio real apuntado por DNS (A → 54.146.193.5).
# Colocá en /etc/nginx/sites-available/bitflow y enlazá en sites-enabled; luego `certbot --nginx -d TU_DOMINIO`.
# El bundle Next (output:'standalone') lo buildeás FUERA de la caja y lo levanta pm2 (bitflow-web, :3000).

# HTTP → HTTPS (y deja pasar el challenge de Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TU_DOMINIO;

    # certbot completa estas líneas (ssl_certificate / ssl_certificate_key).
    # ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;

    # Límite de subida razonable; la API maneja JSON chico.
    client_max_body_size 2m;

    # API: proxy SOLO por localhost al backend Node. El backend nunca se expone directo.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Healthcheck del backend (opcional, útil para monitoreo).
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
    }

    # Assets de build de Next: nombre con hash → cache larga e inmutable.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Todo lo demás → Next.js (SSR/SSG) en :3000, same-origin.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
