# nginx reverse proxy para el MVP de BitFlow.
# - 80 → redirige a 443
# - 443 → termina TLS, sirve el frontend estático (SPA) y hace proxy de /api al backend (localhost:3001)
# Reemplazá TU_DOMINIO por el dominio real apuntado por DNS (A → 54.146.193.5).
# Colocá en /etc/nginx/sites-available/bitflow y enlazá en sites-enabled; luego `certbot --nginx -d TU_DOMINIO`.

# HTTP → HTTPS (y deja pasar el challenge de Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TU_DOMINIO;

    # certbot completa estas líneas (ssl_certificate / ssl_certificate_key).
    # ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;

    # Frontend estático (build de producción de CRA → frontend/build copiado acá).
    root /var/www/bitflow;
    index index.html;

    # Límite de subida razonable; la API maneja JSON chico.
    client_max_body_size 2m;

    # API: proxy SOLO por localhost al backend Node. El backend nunca se expone directo.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Healthcheck del backend (opcional, útil para monitoreo).
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
    }

    # SPA: cualquier ruta no-API devuelve index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
