server {
    if ($host = bitflow.community) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bitflow.community;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name bitflow.community;
    ssl_certificate /etc/letsencrypt/live/bitflow.community/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bitflow.community/privkey.pem; # managed by Certbot

    root /var/www/bitflow;
    index index.html;
    client_max_body_size 2m;

    # API → backend Node (solo localhost).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /health { proxy_pass http://127.0.0.1:3001/health; }

    # index.html SIEMPRE revalidado → tras cada deploy, un refresh normal trae el bundle nuevo.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # Assets con hash en el nombre (main.XXXX.js) → cache larga e inmutable (cambian de nombre al rebuildearse).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: rutas no-API → index.html.
    location / { try_files $uri $uri/ /index.html; }
}
